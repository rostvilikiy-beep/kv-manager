<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog kropli okulistycznych</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one horizontal swipe track, the active card centred, the chosen bottle lifts out of its box.
   Palette: clinical teal-grey ground, deep ink, brand blue for actions. */
:root {
  --bg: #eef4f4;
  --surface: #ffffff;
  --ink: #0d2528;
  --muted: #56706f;
  --line: #d3e0df;
  --action: #2650a0;
  --action-ink: #ffffff;
  --focus: #0f8a84;
  --shadow: 0 18px 40px -22px rgba(13, 37, 40, 0.45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1c1e;
    --surface: #142a2d;
    --ink: #e6f1f0;
    --muted: #9ab5b3;
    --line: #223d40;
    --action: #5b8fe0;
    --action-ink: #0a1830;
    --focus: #4fc3bc;
    --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1c1e;
  --surface: #142a2d;
  --ink: #e6f1f0;
  --muted: #9ab5b3;
  --line: #223d40;
  --action: #5b8fe0;
  --action-ink: #0a1830;
  --focus: #4fc3bc;
  --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  display: flex;
  flex-direction: column;
  min-height: 100%;
  overflow-x: hidden;
}
h1, h2, h3 { font-family: "Manrope", "Inter", system-ui, sans-serif; text-wrap: balance; margin: 0; }

/* Header */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
}
.brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.cart-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  font: 600 14px/1 "Inter", system-ui, sans-serif;
  white-space: nowrap;
}
.cart-pill .count {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--action);
  color: var(--action-ink);
  display: inline-grid;
  place-items: center;
  font-variant-numeric: tabular-nums;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.cart-pill .count.bump { transform: scale(1.35); }

/* Stage */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 18px;
  max-width: 1100px;
  width: 100%;
  margin: 18px auto 0;
  min-height: 0;
}
.viewport {
  position: relative;
  overflow: hidden;
  padding-top: 90px;   /* head-room so a lifted bottle is not clipped */
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
.viewport.dragging { cursor: grabbing; }
.track {
  display: flex;
  gap: 28px;
  transition: transform .7s cubic-bezier(.2,.7,.2,1);
  will-change: transform;
}
.track.dragging { transition: none; }

/* Card */
.card {
  flex: 0 0 auto;
  width: clamp(230px, 64vw, 300px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 18px 14px 20px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  opacity: .5;
  transform: scale(.92);
  transition: opacity .5s, transform .6s cubic-bezier(.2,.7,.2,1), border-color .3s;
}
.card.is-active { opacity: 1; transform: scale(1); }
.card.is-selected { border-color: var(--focus); }

/* Carton: open top, bottle sits inside behind the front panel */
.box {
  position: relative;
  width: 100%;
  height: 230px;
  background: var(--box-back);
  border-radius: 6px 6px 4px 4px;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.box:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
.box .front {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 128px;
  z-index: 2;
  border-radius: 0 0 4px 4px;
  background: linear-gradient(160deg, var(--box-front-a), var(--box-front-b));
  color: #fff;
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: inset 0 -1px 0 rgba(255,255,255,.18);
}
.box .front .brand-mark {
  font: 800 11px/1 "Manrope", sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: .95;
}
.box .front .vol {
  align-self: flex-end;
  font: 600 11px/1 "Inter", sans-serif;
  background: rgba(255,255,255,.2);
  padding: 4px 7px;
  border-radius: 4px;
}
.box .front .type {
  font: 600 12px/1.25 "Inter", sans-serif;
  opacity: .92;
}

/* Bottle: starts inside the box, lifts out when chosen */
.bottle {
  position: absolute;
  left: 50%;
  bottom: 64px;
  width: 50px;
  height: 128px;
  margin-left: -25px;
  z-index: 1;
  transform-origin: 50% 100%;
  transition: transform .9s cubic-bezier(.34,1.45,.64,1);
  pointer-events: none;
}
.bottle .cap {
  position: absolute;
  top: 0; left: 50%;
  width: 22px; height: 24px;
  margin-left: -11px;
  border-radius: 5px 5px 3px 3px;
  background: linear-gradient(90deg, #c9d7d6, #f4f8f8, #c9d7d6);
}
.bottle .neck {
  position: absolute;
  top: 22px; left: 50%;
  width: 16px; height: 12px;
  margin-left: -8px;
  background: #e8f0ef;
}
.bottle .body {
  position: absolute;
  top: 32px; left: 0; right: 0; bottom: 0;
  border-radius: 14px 14px 10px 10px;
  background: linear-gradient(90deg, #dbe6e5, #ffffff 45%, #e6eeed);
  box-shadow: inset 0 0 0 1px rgba(13,37,40,.08);
  overflow: hidden;
}
.bottle .body::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 46%;
  height: 34%;
  background: var(--box-front-a);
}
.bottle.out {
  transform: translate3d(0, -128px, 0) rotate(-6deg) scale(1.22);
  z-index: 4;
}
.card.is-selected .box { box-shadow: 0 0 0 2px var(--focus); }

/* Text under the box */
.info { text-align: center; display: flex; flex-direction: column; gap: 4px; width: 100%; }
.info h2 { font-size: 17px; font-weight: 700; }
.info .sub { font-size: 13px; color: var(--muted); }
.price { display: flex; justify-content: center; align-items: baseline; gap: 8px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.price .now { font: 800 20px/1 "Manrope", sans-serif; }
.price .old { font-size: 13px; color: var(--muted); text-decoration: line-through; }
.price .tag { font-size: 11px; color: var(--muted); }
.promo {
  position: absolute;
  top: 12px; right: 12px;
  font: 700 10px/1 "Inter", sans-serif;
  letter-spacing: .08em;
  padding: 5px 7px;
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  text-transform: uppercase;
}
.card { position: relative; }

.add {
  width: 100%;
  min-height: 44px;
  border: 0;
  border-radius: 8px;
  background: var(--action);
  color: var(--action-ink);
  font: 700 13px/1 "Inter", sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: filter .2s, transform .15s;
}
.add:hover { filter: brightness(1.08); }
.add:active { transform: scale(.98); }
.add.is-on { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--action); }
.add:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.nav {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 20px;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.nav:disabled { opacity: .35; cursor: default; }
.nav:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.dots { display: flex; gap: 8px; }
.dot {
  width: 9px; height: 9px;
  border-radius: 999px;
  border: 0;
  padding: 0;
  background: var(--line);
  cursor: pointer;
  transition: width .3s, background .3s;
}
.dot.is-on { width: 26px; background: var(--action); }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0; }

/* Basket summary */
.basket {
  max-width: 1100px;
  width: 100%;
  margin: 28px auto 0;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
}
.basket .list { font-size: 14px; color: var(--muted); min-width: 0; flex: 1 1 220px; overflow-wrap: anywhere; }
.basket .list strong { color: var(--ink); font-weight: 600; }
.basket .sum { font: 800 18px/1 "Manrope", sans-serif; font-variant-numeric: tabular-nums; }
.basket .clear {
  border: 0; background: none; color: var(--action);
  font: 600 13px/1 "Inter", sans-serif; cursor: pointer; padding: 8px 4px;
}
.basket .clear:disabled { color: var(--muted); cursor: default; }

@media (max-width: 480px) {
  .bottle.out { transform: translate3d(0, -104px, 0) rotate(-6deg) scale(1.12); }
  .stage { margin-top: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Krople do oczu</h1>
    <p>Przesuń, aby zobaczyć produkty. Dotknij pudełka, aby dodać.</p>
  </div>
  <div class="cart-pill" aria-live="polite">
    Koszyk <span class="count" id="cartCount">0</span>
  </div>
</header>

<main class="stage">
  <div class="viewport" id="viewport" aria-roledescription="karuzela" aria-label="Produkty">
    <div class="track" id="track"></div>
  </div>

  <div class="controls">
    <button class="nav" id="prev" aria-label="Poprzedni produkt">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button class="nav" id="next" aria-label="Następny produkt">&#8594;</button>
  </div>
  <p class="hint">Strzałki klawiatury też działają.</p>
</main>

<section class="basket" aria-label="Podsumowanie koszyka">
  <div class="list" id="basketList">Koszyk jest pusty.</div>
  <div class="sum" id="basketSum">0,00 zł</div>
  <button class="clear" id="clearBtn" disabled>Wyczyść koszyk</button>
</section>

<script>
// Sample data taken from the product page on screen. Prices are in grosze.
const PRODUCTS = [
  {
    id: "gel-k",
    name: "Ozodrop Gel K",
    sub: "Żel okulistyczny",
    vol: "6 ml",
    type: "Nawilżający żel",
    price: 3871,
    old: 5530,
    promo: true,
    front: ["#1aa39a", "#0d6b6a"],
    back: "#0b5e5d"
  },
  {
    id: "ozodrop",
    name: "Ozodrop",
    sub: "Krople okulistyczne",
    vol: "8 ml",
    type: "Krople nawilżające",
    price: 4901,
    old: null,
    promo: false,
    front: ["#3d9be0", "#2459a8"],
    back: "#1d4b86"
  },
  {
    id: "immunodrop",
    name: "Immunodrop",
    sub: "Krople okulistyczne",
    vol: "8 ml",
    type: "Krople wspierające",
    price: 4901,
    old: null,
    promo: false,
    front: ["#6fa58f", "#3f7663"],
    back: "#33604f"
  }
];

const fmt = (grosze) => (grosze / 100).toLocaleString("pl-PL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " zł";

const viewport = document.getElementById("viewport");
const track = document.getElementById("track");
const dotsEl = document.getElementById("dots");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const cartCount = document.getElementById("cartCount");
const basketList = document.getElementById("basketList");
const basketSum = document.getElementById("basketSum");
const clearBtn = document.getElementById("clearBtn");

const selected = new Set();
let index = 0;
let cardW = 0;
let step = 0;

// Build cards
PRODUCTS.forEach((p, i) => {
  const card = document.createElement("article");
  card.className = "card";
  card.dataset.id = p.id;
  card.setAttribute("aria-label", p.name);
  card.style.setProperty("--box-front-a", p.front[0]);
  card.style.setProperty("--box-front-b", p.front[1]);
  card.style.setProperty("--box-back", p.back);

  const priceHtml = p.old
    ? `<span class="now">${fmt(p.price)}</span><span class="old">${fmt(p.old)}</span><span class="tag">z VAT</span>`
    : `<span class="now">${fmt(p.price)}</span><span class="tag">z VAT</span>`;

  card.innerHTML = `
    ${p.promo ? '<span class="promo">Promocja</span>' : ""}
    <div class="box" role="button" tabindex="0" aria-pressed="false" aria-label="${p.name}, dotknij, aby dodać do koszyka">
      <div class="bottle" aria-hidden="true">
        <div class="cap"></div>
        <div class="neck"></div>
        <div class="body"></div>
      </div>
      <div class="front">
        <span class="brand-mark">Ozodrop</span>
        <span class="type">${p.type}</span>
        <span class="vol">${p.vol}</span>
      </div>
    </div>
    <div class="info">
      <h2>${p.name}</h2>
      <span class="sub">${p.sub}</span>
      <div class="price">${priceHtml}</div>
    </div>
    <button class="add" type="button" aria-pressed="false">Dodaj do koszyka</button>
  `;

  const box = card.querySelector(".box");
  const btn = card.querySelector(".add");
  box.addEventListener("click", () => onPick(i));
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(i); }
  });
  btn.addEventListener("click", () => onPick(i));

  track.appendChild(card);

  const dot = document.createElement("button");
  dot.className = "dot";
  dot.type = "button";
  dot.setAttribute("aria-label", `Produkt ${i + 1}: ${p.name}`);
  dot.addEventListener("click", () => goTo(i));
  dotsEl.appendChild(dot);
});

function metrics() {
  const first = track.children[0];
  cardW = first.offsetWidth;
  const gap = parseFloat(getComputedStyle(track).columnGap) || 28;
  step = cardW + gap;
}

function place(dx = 0) {
  const x = viewport.clientWidth / 2 - cardW / 2 - index * step + dx;
  track.style.transform = `translate3d(${x}px, 0, 0)`;
}

function render() {
  [...track.children].forEach((card, i) => {
    const active = i === index;
    card.classList.toggle("is-active", active);
    card.setAttribute("aria-hidden", active ? "false" : "true");
  });
  [...dotsEl.children].forEach((d, i) => {
    d.classList.toggle("is-on", i === index);
    d.setAttribute("aria-current", i === index ? "true" : "false");
  });
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === PRODUCTS.length - 1;
}

function goTo(i) {
  index = Math.max(0, Math.min(PRODUCTS.length - 1, i));
  place();
  render();
}

// Choosing a product: its bottle lifts out of the box, or slides back in when unchosen.
function onPick(i) {
  if (dragMoved) return;
  const p = PRODUCTS[i];
  const card = track.children[i];
  const on = !selected.has(p.id);
  on ? selected.add(p.id) : selected.delete(p.id);

  card.querySelector(".bottle").classList.toggle("out", on);
  card.classList.toggle("is-selected", on);
  const btn = card.querySelector(".add");
  btn.textContent = on ? "Usuń z koszyka" : "Dodaj do koszyka";
  btn.classList.toggle("is-on", on);
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  card.querySelector(".box").setAttribute("aria-pressed", on ? "true" : "false");

  if (on) {
    index = i;
    place();
    render();
  }
  updateBasket(on);
}

function updateBasket(bumped) {
  const items = PRODUCTS.filter((p) => selected.has(p.id));
  const total = items.reduce((s, p) => s + p.price, 0);
  const count = items.length;
  cartCount.textContent = count;
  if (bumped) {
    cartCount.classList.remove("bump");
    void cartCount.offsetWidth;
    cartCount.classList.add("bump");
    setTimeout(() => cartCount.classList.remove("bump"), 300);
  }
  basketList.innerHTML = count
    ? items.map((p) => `<strong>${p.name}</strong>`).join(", ")
    : "Koszyk jest pusty.";
  basketSum.textContent = fmt(total);
  clearBtn.disabled = count === 0;
}

clearBtn.addEventListener("click", () => {
  [...selected].forEach((id) => {
    const i = PRODUCTS.findIndex((p) => p.id === id);
    const card = track.children[i];
    card.querySelector(".bottle").classList.remove("out");
    card.classList.remove("is-selected");
    const btn = card.querySelector(".add");
    btn.textContent = "Dodaj do koszyka";
    btn.classList.remove("is-on");
    btn.setAttribute("aria-pressed", "false");
  });
  selected.clear();
  updateBasket(false);
});

prevBtn.addEventListener("click", () => goTo(index - 1));
nextBtn.addEventListener("click", () => goTo(index + 1));

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") goTo(index - 1);
  if (e.key === "ArrowRight") goTo(index + 1);
});

// Swipe / drag
let startX = 0;
let dragging = false;
let dragMoved = false;
viewport.addEventListener("pointerdown", (e) => {
  dragging = true;
  dragMoved = false;
  startX = e.clientX;
  track.classList.add("dragging");
  viewport.classList.add("dragging");
});
window.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 6) dragMoved = true;
  place(dx);
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  track.classList.remove("dragging");
  viewport.classList.remove("dragging");
  const dx = e.clientX - startX;
  if (dx < -50) goTo(index + 1);
  else if (dx > 50) goTo(index - 1);
  else place();
  // Clear the drag flag after the click event (if any) has been dispatched.
  setTimeout(() => { dragMoved = false; }, 0);
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

window.addEventListener("resize", () => { metrics(); place(); });

metrics();
goTo(0);
updateBasket(false);
</script>
</body>
</html>
