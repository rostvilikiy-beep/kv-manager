<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog kropli okulistycznych</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: 3D product stage in the centre, product sheet (price, description) at the side; stacks on phones.
   Palette: clinical cool ground, deep ink, the shop's blue for actions, a per-product tint from the carton. */
:root {
  --bg: #edf3f4;
  --surface: #ffffff;
  --ink: #0d2528;
  --muted: #587173;
  --line: #d3e0e0;
  --action: #2650a0;
  --action-ink: #ffffff;
  --focus: #0f8a84;
  --floor: rgba(13, 37, 40, 0.28);
  --stage-a: #ffffff;
  --stage-b: #e3ecee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1a1c;
    --surface: #132a2d;
    --ink: #e6f1f0;
    --muted: #9ab5b3;
    --line: #213c3f;
    --action: #5b8fe0;
    --action-ink: #08162c;
    --focus: #4fc3bc;
    --floor: rgba(0, 0, 0, 0.6);
    --stage-a: #1b3639;
    --stage-b: #0e2123;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1a1c;
  --surface: #132a2d;
  --ink: #e6f1f0;
  --muted: #9ab5b3;
  --line: #213c3f;
  --action: #5b8fe0;
  --action-ink: #08162c;
  --focus: #4fc3bc;
  --floor: rgba(0, 0, 0, 0.6);
  --stage-a: #1b3639;
  --stage-b: #0e2123;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px;
  overflow-x: hidden;
}
h1, h2 { font-family: "Manrope", "Inter", system-ui, sans-serif; text-wrap: balance; margin: 0; }

.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.top p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.cart-pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 8px 8px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font: 600 14px/1 "Inter", system-ui, sans-serif; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.cart-pill .count {
  min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px;
  background: var(--action); color: var(--action-ink);
  display: inline-grid; place-items: center;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.cart-pill .count.bump { transform: scale(1.3); }

/* Main grid */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: stretch; }

/* Stage */
.stage {
  position: relative;
  min-height: 600px;
  border-radius: 24px;
  background:
    radial-gradient(120% 80% at 50% 20%, var(--stage-a), var(--stage-b) 70%),
    var(--stage-b);
  overflow: hidden;
  perspective: 1500px;
  perspective-origin: 50% 35%;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  isolation: isolate;
}
.stage.dragging { cursor: grabbing; }
.stage::before {
  /* product tint glow behind the carton */
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(45% 40% at 50% 55%, var(--tint, transparent), transparent 70%);
  opacity: .35;
  transition: background .6s;
  z-index: -1;
}
.cam {
  position: absolute;
  left: 50%;
  top: 80%;
  width: 0; height: 0;
  transform-style: preserve-3d;
  transform: rotateX(-11deg);
}
.prod, .shift { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.shift { transition: transform .8s cubic-bezier(.3,.7,.2,1) .25s; }
.prod.is-open .shift { transform: translateX(calc(var(--W) * -0.58)); transition-delay: .45s; }

/* Carton: six faces, each with a printed outside and a plain cardboard inside */
.box {
  position: absolute;
  width: var(--W); height: var(--H);
  left: calc(var(--W) / -2); top: calc(var(--H) * -1);
  transform-style: preserve-3d;
}
.face { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.face > i { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face > i.out { background-size: 100% 100%; background-color: #f4f7f7; }
.face > i.in { transform: rotateY(180deg); background: #d9d2c4; box-shadow: inset 0 0 30px rgba(0,0,0,.25); }
.f-front { width: var(--W); height: var(--H); transform: translateZ(calc(var(--D) / 2)); }
.f-back  { width: var(--W); height: var(--H); transform: rotateY(180deg) translateZ(calc(var(--D) / 2)); }
.f-left  { width: var(--D); height: var(--H); left: calc((var(--W) - var(--D)) / 2); transform: rotateY(-90deg) translateZ(calc(var(--W) / 2)); }
.f-right { width: var(--D); height: var(--H); left: calc((var(--W) - var(--D)) / 2); transform: rotateY(90deg) translateZ(calc(var(--W) / 2)); }
.f-bottom { width: var(--W); height: var(--D); top: calc((var(--H) - var(--D)) / 2); transform: rotateX(-90deg) translateZ(calc(var(--H) / 2)); }
.f-lid {
  width: var(--W); height: var(--D); top: 0;
  transform-origin: 50% 0;
  transform: translateZ(calc(var(--D) / -2)) rotateX(90deg);
  transition: transform .5s cubic-bezier(.4,.1,.3,1) 1s;
}
.prod.is-open .f-lid { transform: translateZ(calc(var(--D) / -2)) rotateX(212deg); transition-delay: 0s; }
.f-lid > i.out, .f-bottom > i.out {
  background:
    linear-gradient(90deg, var(--accent) 0 22%, transparent 22%),
    linear-gradient(180deg, #ffffff, #e9eff0);
}
.f-lid > i.out::after {
  /* tuck flap crease */
  content: ""; position: absolute; left: 0; right: 0; bottom: 14%;
  height: 1px; background: rgba(13,37,40,.15);
}

/* Bottle: a cut-out photo standing inside the carton */
.bottle {
  position: absolute;
  width: var(--BW); height: var(--BH);
  left: calc(var(--BW) / -2); top: calc(var(--BH) * -1);
  background-size: 100% 100%;
  transform-origin: 50% 100%;
  transform: translate3d(0, 0, 0);
  filter: drop-shadow(0 6px 10px rgba(13,37,40,.18));
  pointer-events: none;
}
.bottle.opening { animation: flyOut 1.35s cubic-bezier(.45,.05,.25,1) .3s both; }
.bottle.closing { animation: flyIn 1.1s cubic-bezier(.45,.05,.25,1) both; }
.bottle.is-out  { transform: translate3d(calc(var(--W) * 1.18), 0, calc(var(--D) * .7)) scale(1.1); }
@keyframes flyOut {
  0%   { transform: translate3d(0, 0, 0) rotateZ(0) scale(1); }
  32%  { transform: translate3d(0, calc(var(--H) * -1.04), 0) rotateZ(0) scale(1); }
  64%  { transform: translate3d(calc(var(--W) * .85), calc(var(--H) * -1.12), calc(var(--D) * .45)) rotateZ(16deg) scale(1.08); }
  86%  { transform: translate3d(calc(var(--W) * 1.18), calc(var(--H) * -.06), calc(var(--D) * .7)) rotateZ(-3deg) scale(1.1); }
  100% { transform: translate3d(calc(var(--W) * 1.18), 0, calc(var(--D) * .7)) rotateZ(0) scale(1.1); }
}
@keyframes flyIn {
  0%   { transform: translate3d(calc(var(--W) * 1.18), 0, calc(var(--D) * .7)) rotateZ(0) scale(1.1); }
  36%  { transform: translate3d(calc(var(--W) * .85), calc(var(--H) * -1.12), calc(var(--D) * .45)) rotateZ(16deg) scale(1.08); }
  68%  { transform: translate3d(0, calc(var(--H) * -1.04), 0) rotateZ(0) scale(1); }
  100% { transform: translate3d(0, 0, 0) rotateZ(0) scale(1); }
}

/* Soft contact shadows on the floor */
.shadow {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--floor), transparent);
  transform: rotateX(90deg);
  pointer-events: none;
}
.shadow.box-sh { width: calc(var(--W) * 2.1); height: calc(var(--D) * 2.1); left: calc(var(--W) * -1.05); top: calc(var(--D) * -1.05 + 1px); }
.shadow.bottle-sh {
  width: calc(var(--BW) * 2); height: calc(var(--BW) * 2);
  left: calc(var(--W) * 1.18 - var(--BW)); top: calc(var(--BW) * -1 + 1px);
  transform: translateZ(calc(var(--D) * .7)) rotateX(90deg);
  opacity: 0; transition: opacity .2s;
}
.prod.is-open .bottle-sh { opacity: 1; transition: opacity .4s 1.45s; }

/* Stage chrome */
.arrow {
  position: absolute; top: 50%; z-index: 5;
  width: 48px; height: 48px; margin-top: -24px;
  border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  font-size: 20px; cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 8px 20px -12px rgba(13,37,40,.5);
}
.arrow.prev { left: 16px; }
.arrow.next { right: 16px; }
.arrow:disabled { opacity: .3; cursor: default; }
.arrow:focus-visible, .thumb:focus-visible, .buy:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.stage-foot {
  position: absolute; left: 0; right: 0; bottom: 16px; z-index: 5;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-inline: 16px;
}
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.thumb {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 999px; padding: 7px 12px;
  font: 600 12px/1 "Inter", sans-serif; cursor: pointer;
  transition: background .3s, color .3s, border-color .3s;
}
.thumb.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.thumb .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--action); margin-left: 6px; vertical-align: middle; }
.hint { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }
.badge {
  position: absolute; top: 16px; left: 16px; z-index: 5;
  font: 700 11px/1 "Inter", sans-serif; letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 9px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--ink); color: var(--ink);
}

/* Product sheet */
.sheet {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 26px 24px;
  display: flex; flex-direction: column; gap: 18px;
  min-width: 0;
}
.sheet .kicker { font: 600 12px/1 "Inter", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink, var(--muted)); }
.sheet h2 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.sheet .desc { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 60ch; }
.specs { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; border-top: 1px solid var(--line); }
.specs li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.specs li span:first-child { color: var(--muted); }
.specs li span:last-child { font-weight: 600; text-align: right; }
.price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-variant-numeric: tabular-nums; }
.price-row .now { font: 800 36px/1 "Manrope", sans-serif; letter-spacing: -0.02em; }
.price-row .now.promo { color: #c8312f; }
.price-row .old { font-size: 16px; color: var(--muted); text-decoration: line-through; }
.price-row .vat { font-size: 13px; color: var(--muted); }
.saving { font-size: 13px; font-weight: 600; color: #c8312f; margin-top: -10px; }
.buy {
  min-height: 52px; border: 0; border-radius: 10px;
  background: var(--action); color: var(--action-ink);
  font: 700 14px/1 "Inter", sans-serif; letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer; transition: filter .2s, transform .15s, background .3s, color .3s;
}
.buy:hover { filter: brightness(1.08); }
.buy:active { transform: scale(.985); }
.buy.is-on { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--action); }
.sheet .fade { transition: opacity .25s, transform .25s; }
.sheet.swap .fade { opacity: 0; transform: translateY(6px); }
.total { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.total strong { color: var(--ink); }

@media (max-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { min-height: 0; height: 66vh; max-height: 600px; min-height: 440px; }
  .sheet h2 { font-size: 26px; }
  .price-row .now { font-size: 30px; }
}
@media (max-width: 480px) {
  .arrow { width: 42px; height: 42px; margin-top: -21px; }
  .arrow.prev { left: 10px; } .arrow.next { right: 10px; }
  .top p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .bottle.opening, .bottle.closing { animation-duration: .01ms; animation-delay: 0s; }
  .f-lid, .shift, .prod.is-open .f-lid, .prod.is-open .shift { transition-duration: .01ms; transition-delay: 0s; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Krople do oczu FB Vision</h1>
      <p>Przesuń w bok, aby zmienić produkt. Dotknij pudełka, aby je otworzyć.</p>
    </div>
    <div class="cart-pill" aria-live="polite">
      <span id="cartTotal">0,00 zł</span>
      <span class="count" id="cartCount" aria-label="Produkty w koszyku">0</span>
    </div>
  </header>

  <div class="layout">
    <section class="stage" id="stage" aria-label="Produkt w 3D">
      <span class="badge" id="badge" hidden>Promocja</span>
      <div class="cam" id="cam"></div>
      <button class="arrow prev" id="prev" type="button" aria-label="Poprzedni produkt">&#8592;</button>
      <button class="arrow next" id="next" type="button" aria-label="Następny produkt">&#8594;</button>
      <div class="stage-foot">
        <div class="thumbs" id="thumbs"></div>
        <p class="hint">Przeciągnij lekko, aby obrócić pudełko</p>
      </div>
    </section>

    <aside class="sheet" id="sheet" aria-live="polite">
      <div class="fade" style="display:flex;flex-direction:column;gap:10px">
        <span class="kicker" id="kicker"></span>
        <h2 id="name"></h2>
      </div>
      <p class="desc fade" id="desc"></p>
      <ul class="specs fade" id="specs"></ul>
      <div class="price-row fade" id="price"></div>
      <div class="saving fade" id="saving" hidden></div>
      <button class="buy" id="buy" type="button" aria-pressed="false">Dodaj do koszyka</button>
      <div class="total"><span id="cartList">Koszyk jest pusty</span><strong id="cartSum">0,00 zł</strong></div>
    </aside>
  </div>
</div>

<script>
// Products. Box faces and bottles are cut from the shop photos (img/). Prices are in grosze.
// Descriptions follow the text printed on each carton; check them before going live.
const PRODUCTS = [
  {
    id: "gelk", name: "Ozodrop Gel K", kicker: "Żel okulistyczny",
    desc: "Ochronny i nawilżający żel okulistyczny z technologią LipozonEye. Sterylny, w butelce z kroplomierzem.",
    specs: [["Pojemność", "6 ml"], ["Postać", "Żel"], ["Producent", "FB Vision"]],
    price: 3871, old: 5530,
    ratio: 2.096, aspect: 0.331, accent: "#139488", tint: "rgba(19,148,136,.55)"
  },
  {
    id: "ozo", name: "Ozodrop", kicker: "Krople do oczu",
    desc: "Nawilżające i ochronne krople do oczu z technologią LipozonEye. Sterylne, w butelce z kroplomierzem.",
    specs: [["Pojemność", "8 ml"], ["Postać", "Krople"], ["Producent", "FB Vision"]],
    price: 4901, old: null,
    ratio: 2.2, aspect: 0.348, accent: "#2b8fd8", tint: "rgba(43,143,216,.5)"
  },
  {
    id: "immuno", name: "Immunodrop", kicker: "Krople do oczu",
    desc: "Krople oczne chroniące powierzchnię oka. Sterylne, w butelce z kroplomierzem.",
    specs: [["Pojemność", "8 ml"], ["Postać", "Krople"], ["Producent", "FB Vision"]],
    price: 4901, old: null,
    ratio: 1.875, aspect: 0.343, accent: "#1aa36a", tint: "rgba(26,163,106,.5)"
  }
];

const fmt = (g) => (g / 100).toLocaleString("pl-PL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " zł";
const $ = (id) => document.getElementById(id);
const stage = $("stage"), cam = $("cam"), sheet = $("sheet");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const cart = new Set();
let index = 0;
let prodEl = null;
let boxEl = null;
let dragDx = 0;
let spin = 0;          // extra rotation from dragging, eases back to 0
let busy = false;

// ---------- 3D product ----------
function sizeVars(p) {
  const r = stage.getBoundingClientRect();
  let H = Math.min(r.height * 0.42, 320);
  let W = H / p.ratio;
  W = Math.min(W, r.width * 0.27);
  H = W * p.ratio;
  const D = W * 0.92;
  const BH = H * 0.74;
  return { W, H, D, BH, BW: BH * p.aspect };
}

function applySize(el, p) {
  const s = sizeVars(p);
  for (const k of ["W", "H", "D", "BW", "BH"]) el.style.setProperty("--" + k, s[k].toFixed(1) + "px");
}

function face(cls, img) {
  const f = document.createElement("div");
  f.className = "face " + cls;
  const out = document.createElement("i");
  out.className = "out";
  if (img) out.style.backgroundImage = `url("${img}")`;
  const inn = document.createElement("i");
  inn.className = "in";
  f.append(out, inn);
  return f;
}

function buildProduct(p) {
  const prod = document.createElement("div");
  prod.className = "prod";
  prod.style.setProperty("--accent", p.accent);
  applySize(prod, p);

  const shift = document.createElement("div");
  shift.className = "shift";

  const boxSh = document.createElement("div");
  boxSh.className = "shadow box-sh";
  const botSh = document.createElement("div");
  botSh.className = "shadow bottle-sh";

  const box = document.createElement("div");
  box.className = "box";
  box.append(
    face("f-back", `img/${p.id}-front.jpg`),
    face("f-right", `img/${p.id}-side.jpg`),
    face("f-bottom"),
    face("f-left", `img/${p.id}-side.jpg`),
    face("f-front", `img/${p.id}-front.jpg`),
    face("f-lid")
  );

  const bottle = document.createElement("div");
  bottle.className = "bottle";
  bottle.style.backgroundImage = `url("img/${p.id}-bottle.png")`;

  shift.append(boxSh, botSh, box, bottle);
  prod.append(shift);

  if (cart.has(p.id)) {
    prod.classList.add("is-open");
    bottle.classList.add("is-out");
  }
  return prod;
}

function mount(p, from) {
  const el = buildProduct(p);
  cam.appendChild(el);
  prodEl = el;
  boxEl = el.querySelector(".box");
  if (from && !reduceMotion) {
    el.animate(
      [
        { transform: `translateX(${from * 70}vw) rotateY(${from * -50}deg)`, opacity: 0 },
        { transform: "translateX(0) rotateY(0)", opacity: 1 }
      ],
      { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)" }
    );
  }
}

function go(dir) {
  const next = index + dir;
  if (busy || next < 0 || next >= PRODUCTS.length) { spin = 0; return; }
  busy = true;
  const old = prodEl;
  index = next;
  const done = () => { old.remove(); busy = false; };
  if (reduceMotion) done();
  else old.animate(
    [
      { transform: `translateX(${dragDx}px) rotateY(0)`, opacity: 1 },
      { transform: `translateX(${-dir * 70}vw) rotateY(${dir * 50}deg)`, opacity: 0 }
    ],
    { duration: 450, easing: "cubic-bezier(.5,0,.8,.4)", fill: "forwards" }
  ).onfinish = done;
  spin = 0;
  mount(PRODUCTS[index], dir);
  renderInfo(true);
}

// Gentle idle sway plus drag rotation
let t0 = performance.now();
function frame(t) {
  if (boxEl) {
    const idle = reduceMotion ? 0 : Math.sin((t - t0) / 1600) * 7;
    if (!dragging) spin *= 0.9;
    boxEl.style.transform = `rotateY(${32 + idle + spin}deg)`;
  }
  requestAnimationFrame(frame);
}

// ---------- Open / close ----------
function toggle() {
  const p = PRODUCTS[index];
  const bottle = prodEl.querySelector(".bottle");
  const on = !cart.has(p.id);
  on ? cart.add(p.id) : cart.delete(p.id);
  bottle.classList.remove("opening", "closing", "is-out");
  void bottle.offsetWidth;
  if (on) {
    prodEl.classList.add("is-open");
    bottle.classList.add("opening");
    bottle.addEventListener("animationend", function fin() {
      bottle.removeEventListener("animationend", fin);
      if (bottle.classList.contains("opening")) { bottle.classList.remove("opening"); bottle.classList.add("is-out"); }
    });
  } else {
    prodEl.classList.remove("is-open");
    bottle.classList.add("closing");
    bottle.addEventListener("animationend", function fin() {
      bottle.removeEventListener("animationend", fin);
      bottle.classList.remove("closing");
    });
  }
  renderInfo(false);
  renderCart(true);
}

// ---------- Side sheet ----------
function renderInfo(animate) {
  const p = PRODUCTS[index];
  const fill = () => {
    $("kicker").textContent = p.kicker;
    $("name").textContent = p.name;
    $("desc").textContent = p.desc;
    $("specs").innerHTML = p.specs.map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join("");
    $("price").innerHTML = p.old
      ? `<span class="now promo">${fmt(p.price)}</span><span class="old">${fmt(p.old)}</span><span class="vat">z VAT</span>`
      : `<span class="now">${fmt(p.price)}</span><span class="vat">z VAT</span>`;
    const saving = $("saving");
    saving.hidden = !p.old;
    if (p.old) saving.textContent = `Oszczędzasz ${fmt(p.old - p.price)} (−${Math.round((1 - p.price / p.old) * 100)}%)`;
    $("badge").hidden = !p.old;
    stage.style.setProperty("--tint", p.tint);
    sheet.style.setProperty("--accent-ink", p.accent);
    sheet.classList.remove("swap");
  };
  if (animate && !reduceMotion) { sheet.classList.add("swap"); setTimeout(fill, 220); } else fill();

  const on = cart.has(p.id);
  const buy = $("buy");
  buy.textContent = on ? "Usuń z koszyka" : "Dodaj do koszyka";
  buy.classList.toggle("is-on", on);
  buy.setAttribute("aria-pressed", String(on));

  $("prev").disabled = index === 0;
  $("next").disabled = index === PRODUCTS.length - 1;
  [...$("thumbs").children].forEach((b, i) => {
    b.classList.toggle("is-on", i === index);
    b.setAttribute("aria-current", i === index ? "true" : "false");
  });
}

function renderCart(bump) {
  const items = PRODUCTS.filter((p) => cart.has(p.id));
  const sum = items.reduce((s, p) => s + p.price, 0);
  $("cartCount").textContent = items.length;
  $("cartTotal").textContent = fmt(sum);
  $("cartSum").textContent = fmt(sum);
  $("cartList").textContent = items.length ? items.map((p) => p.name).join(", ") : "Koszyk jest pusty";
  [...$("thumbs").children].forEach((b, i) => {
    b.querySelector(".dot").hidden = !cart.has(PRODUCTS[i].id);
  });
  if (bump) {
    const c = $("cartCount");
    c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
    setTimeout(() => c.classList.remove("bump"), 300);
  }
}

// ---------- Controls ----------
PRODUCTS.forEach((p, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "thumb";
  b.innerHTML = `${p.name}<span class="dot" hidden></span>`;
  b.addEventListener("click", () => { if (i !== index) go(i - index > 0 ? 1 : -1) ; });
  $("thumbs").appendChild(b);
});
$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));
$("buy").addEventListener("click", toggle);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

// Swipe: a long drag changes product, a short drag spins the carton, a tap opens it.
let dragging = false, startX = 0, startY = 0, moved = false;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button")) return;
  dragging = true; moved = false; dragDx = 0;
  startX = e.clientX; startY = e.clientY;
  stage.classList.add("dragging");
});
window.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  dragDx = e.clientX - startX;
  if (Math.abs(dragDx) > 6) moved = true;
  spin = dragDx * 0.45;
  if (prodEl) prodEl.style.transform = `translateX(${dragDx * 0.35}px)`;
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  stage.classList.remove("dragging");
  if (prodEl) prodEl.style.transform = "";
  const dx = e.clientX - startX;
  if (!moved) {
    // tap: open/close only when the tap lands near the product
    const r = stage.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    if (Math.abs(e.clientX - cx) < r.width * 0.35) toggle();
  } else if (dx < -90) go(1);
  else if (dx > 90) go(-1);
  dragDx = 0;
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

window.addEventListener("resize", () => { if (prodEl) applySize(prodEl, PRODUCTS[index]); });

mount(PRODUCTS[0], 0);
renderInfo(false);
renderCart(false);
requestAnimationFrame(frame);
</script>
</body>
</html>
