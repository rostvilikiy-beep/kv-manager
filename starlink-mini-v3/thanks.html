<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<style>
:root{--font:"Tektur",system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#070707;--panel:#0f0f0f;--line:#262626;--white:#fff;--muted:#9a9a9a;--yellow:#ffd400;--ease:cubic-bezier(.2,.7,.2,1);--cut:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:#e6e6e6;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;object-position:55% 50%;transform:scale(1.06);animation:zoom 14s var(--ease) forwards}
@keyframes zoom{to{transform:scale(1)}}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,7,7,.92),rgba(7,7,7,.55) 55%,rgba(7,7,7,.75))}
.bg::before{content:"";position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(255,212,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,212,0,.06) 1px,transparent 1px);background-size:56px 56px}
header{position:relative;z-index:2;padding:18px 32px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:.08em;color:var(--white);text-decoration:none}
.logo img{width:44px;height:auto}
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 48px}
.card{position:relative;width:min(560px,100%);background:rgba(15,15,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);padding:44px 36px;text-align:center;animation:pop .7s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(20px)}}
.card::before,.card::after{content:"";position:absolute;width:24px;height:24px;border:2px solid var(--yellow)}
.card::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.card::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.tick{width:76px;height:76px;margin:0 auto 22px;background:var(--yellow);display:grid;place-items:center;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));animation:tick .6s .25s var(--ease) both}
@keyframes tick{from{transform:scale(.4);opacity:0}}
.tick svg{width:36px;height:36px}
.tick path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tag{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
.tag::before{content:"";width:8px;height:8px;background:var(--yellow)}
h1{font-size:clamp(30px,6vw,46px);font-weight:900;line-height:1;text-transform:uppercase;color:var(--white);margin:14px 0 14px}
h1 span{color:var(--yellow)}
p{color:#cfcfcf;font-size:16px;line-height:1.55;max-width:420px;margin:0 auto}
.btn{--h:56px;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:var(--h);padding:0 28px;margin-top:30px;font:700 14px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#000;background:var(--yellow);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));transition:background .3s}
.btn:hover{background:#ffe14d}
.btn svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.btn:hover svg{transform:translateX(-4px)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
footer{position:relative;z-index:2;padding:16px 32px;font-size:11px;color:#6a6a6a}
@media (max-width:520px){header,footer{padding-left:20px;padding-right:20px}.card{padding:36px 22px}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tick path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><img src="img/wide.webp" alt="" width="1672" height="941"></div>

<header>
  <a class="logo" href="index.html" aria-label="VOMTEX — на головну"><img src="img/logo.png" alt="" width="256" height="225"><span>VOMTEX</span></a>
</header>

<main>
  <div class="card" role="status">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></div>
    <span class="tag">Заявку прийнято</span>
    <h1>Дякуємо<span>!</span></h1>
    <p>Менеджер зв’яжеться з вами найближчим часом.</p>
    <a class="btn" href="index.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 8H3M7 4 3 8l4 4"/></svg>
      Повернутися на сайт
    </a>
  </div>
</main>

<footer>© <span id="y">2026</span> VOMTEX. Starlink є торговою маркою Space Exploration Technologies Corp. Сайт не є офіційним сайтом Starlink.</footer>
<script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
